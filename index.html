<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPR Calculator & Curve Plotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

  <header>
    <h1>IPR<br>Calculator</h1>
    <p>Inflow Performance Relationship / Curve Plotter</p>
  </header>

  <main class="layout">

    <section class="panel">
      <h2>Reservoir &amp; Well Parameters</h2>

      <label for="flowRegime">Flow Regime</label>
      <select id="flowRegime">
        <option value="Pseudo-Steady State Flow">Pseudo-Steady State Flow</option>
        <option value="Transient Flow">Transient Flow</option>
        <option value="Steady State Flow">Steady State Flow</option>
      </select>

      <div class="grid">
        <div><label>Porosity (ϕ)</label><input type="number" id="porosity" step="any" value="0.19"></div>
        <div><label>Permeability (k, md)</label><input type="number" id="permeability" step="any" value="82"></div>
        <div><label>Pay Thickness (h, ft)</label><input type="number" id="pay_thickness" step="any" value="75"></div>
        <div><label>Reservoir Press (P<sub>e</sub>, psi)</label><input type="number" id="reservoir_pressure" step="any"
            value="3500"></div>
        <div><label>Bubble Pt Press (P<sub>b</sub>, psi)</label><input type="number" id="bubble_pressure" step="any"
            value="3150"></div>
        <div><label>Oil FVF (B<sub>o</sub>, bbl/STB)</label><input type="number" id="oil_formation_volume_factor"
            step="any" value="1.1"></div>
        <div><label>Viscosity (μ, cp)</label><input type="number" id="viscosity" step="any" value="1.7"></div>
        <div><label>Compressibility (Ct, psi⁻¹)</label><input type="number" id="compressibility" step="any"
            value="0.0000129"></div>
        <div><label>Drainage radius (r<sub>e</sub>, ft)</label><input type="number" id="drainage_radius" step="any"
            value="600"></div>
        <div><label>Well Radius (r<sub>w</sub>, ft)</label><input type="number" id="well_radius" step="any"
            value="0.325"></div>
        <div><label>Skin Factor (S)</label><input type="number" id="skin" step="any" value="0"></div>
        <div id="time-transient" style="display: none;">
          <label>Time</label>
          <div class="row">
            <input type="number" id="time" step="any" value="12">
            <button type="button" id="button2" onclick="toggleTimeUnit()">hrs</button>
          </div>
        </div>
      </div>

      <div class="results">
        <div class="result"><span>Productivity Index (J)</span><strong id="txtJ">-</strong></div>
        <div class="result"><span>q<sub>v</sub> (STB/d)</span><strong id="txtqv">-</strong></div>
        <div class="result"><span>q<sub>b</sub> (STB/d)</span><strong id="txtqb">-</strong></div>
      </div>
    </section>

    <section class="panel">
      <h2>IPR Curve</h2>
      <div class="chart-container">
        <canvas id="iprChart"></canvas>
      </div>
      <button class="btn" onclick="saveIPRChart()">Save as Image</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>

</html>
