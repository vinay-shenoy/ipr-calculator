<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPR Calculator & Curve Plotter</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light py-4">

<div class="container-fluid px-4">
  <div class="row g-4">
    
    <!-- Left Column: Inputs & Controls -->
    <div class="col-lg-6">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
          <h4 class="card-title text-primary mb-4">Reservoir & Well Parameters</h4>

          <!-- Flow Regime Dropdown -->
          <div class="mb-3">
            <label for="flowRegime" class="form-label fw-bold">Flow Regime</label>
            <select id="flowRegime" class="form-select">
              <option value="Transient Flow">Transient Flow</option>
              <option value="Steady State Flow">Steady State Flow</option>
              <option value="Pseudo-Steady State Flow">Pseudo-Steady State Flow</option>
            </select>
          </div>

          <!-- Inputs Grid -->
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Porosity (ϕ)</label>
              <input type="number" id="txtPoro" class="form-control" step="any" value="0.19">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Permeability (k, md)</label>
              <input type="number" id="txtPerm" class="form-control" step="any" value="82">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Pay Thickness (h, ft)</label>
              <input type="number" id="txtPayz" class="form-control" step="any" value="53">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Reservoir Press (P, psi)</label>
              <input type="number" id="txtResP" class="form-control" step="any" value="5651">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Bubble Pt Press (Pb, psi)</label>
              <input type="number" id="txtBubl" class="form-control" step="any" value="3000">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Oil FVF (Bo, bbl/STB)</label>
              <input type="number" id="txtBo" class="form-control" step="any" value="1.1">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Viscosity (μ, cp)</label>
              <input type="number" id="txtMu" class="form-control" step="any" value="1.7">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Compressibility (Ct, psi⁻¹)</label>
              <input type="number" id="txtCt" class="form-control" step="any" value="0.0000129">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Area (A, acres)</label>
              <input type="number" id="txtArea" class="form-control" step="any" value="640">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Well Radius (rw, ft)</label>
              <input type="number" id="txtRadi" class="form-control" step="any" value="0.328">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Skin Factor (S)</label>
              <input type="number" id="txtSkin" class="form-control" step="any" value="0">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Time</label>
              <div class="input-group">
                <input type="number" id="txtTime" class="form-control" step="any" value="12">
                <button type="button" class="btn btn-outline-secondary" id="button2" onclick="toggleTimeUnit()">hrs</button>
              </div>
            </div>
          </div>

          <button class="btn btn-primary w-100 mt-4 py-2 fw-bold" onclick="calculateIPR()">Calculate & Plot IPR</button>

          <!-- Output Results Cards -->
          <div class="row g-2 mt-3 pt-3 border-top border-secondary-subtle text-center">
            <div class="col-4">
              <div class="bg-light p-2 rounded border">
                <small class="text-muted d-block">PI (J)</small>
                <strong id="txtJ" class="text-primary fs-6">-</strong>
              </div>
            </div>
            <div class="col-4">
              <div class="bg-light p-2 rounded border">
                <small class="text-muted d-block">qv (STB/d)</small>
                <strong id="txtqv" class="text-primary fs-6">-</strong>
              </div>
            </div>
            <div class="col-4">
              <div class="bg-light p-2 rounded border">
                <small class="text-muted d-block">qb (STB/d)</small>
                <strong id="txtqb" class="text-primary fs-6">-</strong>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Right Column: Chart -->
    <div class="col-lg-6">
      <div class="card shadow-sm border-0 rounded-3 h-100">
        <div class="card-body p-4 d-flex flex-column">
          <h4 class="card-title text-primary mb-4">Inflow Performance Relationship (IPR)</h4>
          <div class="flex-grow-1 position-relative" style="min-height: 400px;">
            <canvas id="iprChart"></canvas>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="script.js"></script>

<!-- Bootstrap JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
